server.port=${PORT:8080}

# Supabase Session Pooler (IPv4 compatible)
# FIX: username was postgres.qmXsgacspqmevbtkjtix (capital X) — must be all lowercase
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.qmxsgacspqmevbtkjtix}
spring.datasource.password=${DB_PASSWORD:Supabase438}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool — tuned for Supabase session pooler
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false